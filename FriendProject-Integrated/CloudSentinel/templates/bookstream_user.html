{% extends 'base.html' %}{% block title %}User Security Profile{% endblock %}{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><div><h2>User Security Profile</h2><p class="text-muted">Identity → activity → behavior → risk → response → audit</p></div><a class="btn btn-outline-primary" href="{{ url_for('integration.security_dashboard') }}">Back to Users</a></div>
<div id="profile">Loading...</div>
<script>
const userId={{ user_id|tojson }};
const htmlEscape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function setStatus(status){const r=await fetch('/api/admin/bookstream/user/'+encodeURIComponent(userId),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(!r.ok){alert('Could not update account status.');return}load()}
async function revokeBookStreamSession(sessionId){const r=await fetch('/api/admin/integration/session/'+encodeURIComponent(sessionId)+'/revoke',{method:'POST'});const d=await r.json();if(!r.ok){alert(d.message||'Could not revoke this session.');return}load()}
async function load(){const r=await fetch('/api/admin/integration/user/'+encodeURIComponent(userId));if(!r.ok){document.getElementById('profile').innerHTML='<div class="alert alert-danger">Unable to load user.</div>';return}const d=await r.json(), ev=d.events||[], latest=ev[0]||{};document.getElementById('profile').innerHTML=`
<div class="card cs-card p-3 mb-3"><div class="d-flex justify-content-between"><div><h3>${d.identity.username||'-'}</h3><div>${d.identity.email||''} · ID ${d.identity.id}</div><div class="mt-2"><span class="badge bg-${d.identity.status==='ACTIVE'?'success':'danger'}">Account ${d.identity.status}</span></div><div class="mt-2"><button class="btn btn-sm btn-outline-danger me-1" onclick="setStatus('FROZEN')">Freeze</button><button class="btn btn-sm btn-outline-success" onclick="setStatus('ACTIVE')">Unfreeze</button></div></div><span class="badge bg-${latest.risk_level==='LOW'?'success':latest.risk_level==='MEDIUM'?'warning':'danger'} align-self-start">${latest.risk_level||'LOW'} · ${latest.risk_score??0}</span></div><div class="row mt-3"><div class="col-md-3"><b>AI anomaly</b><br>${latest.anomaly_score??0}</div><div class="col-md-3"><b>Devices</b><br>${new Set(ev.map(x=>x.device).filter(Boolean)).size}</div><div class="col-md-3"><b>IPs</b><br>${new Set(ev.map(x=>x.ip).filter(Boolean)).size}</div><div class="col-md-3"><b>Active sessions</b><br>${(d.sessions||[]).filter(x=>x.presence==='ACTIVE').length}</div></div></div>
<div class="row g-3"><div class="col-lg-8"><div class="card cs-card p-3"><h5>Activity / Audit Timeline</h5><div class="table-responsive"><table class="table table-sm table-hover"><thead><tr><th>Time</th><th>Event</th><th>Resource / Book</th><th>Details</th><th>Session</th><th>IP</th><th>Risk</th><th>Action</th></tr></thead><tbody>${ev.map(e=>`<tr><td>${new Date(e.timestamp).toLocaleString()}</td><td>${htmlEscape(e.type)}</td><td>${htmlEscape(e.resource_name||e.resource_id||'-')}</td><td>${htmlEscape(JSON.stringify(e.metadata||{}))}</td><td>${htmlEscape(e.session_id||'-')}</td><td>${htmlEscape(e.ip||'-')}<br><small>${htmlEscape(e.location||'')}</small></td><td>${htmlEscape(e.risk_level)} · ${htmlEscape(e.risk_score)}</td><td>${htmlEscape(e.action)}${e.reason?`<br><small>${htmlEscape(e.reason)}</small>`:''}</td></tr>`).join('')||'<tr><td colspan="8">No events yet.</td></tr>'}</tbody></table></div></div></div><div class="col-lg-4"><div class="card cs-card p-3"><h5>Sessions</h5>${(d.sessions||[]).map(s=>`<div class="border rounded p-2 mb-2"><b class="text-${s.status!=='ACTIVE'?'secondary':s.presence==='ACTIVE'?'success':'warning'}">${s.status!=='ACTIVE'?'ENDED':s.presence==='ACTIVE'?'RUNNING':'INACTIVE'}</b><br><small>Started: ${new Date(s.created_at).toLocaleString()}</small><br><small>${s.ended_at?`Ended: ${new Date(s.ended_at).toLocaleString()}`:`Last activity: ${new Date(s.last_activity).toLocaleString()}`}</small><br><small>${s.ip||''} · ${s.device||''}</small>${s.status==='ACTIVE'?`<br><button class="btn btn-sm btn-outline-danger mt-2" onclick="revokeBookStreamSession('${htmlEscape(s.id)}')">Revoke session</button>`:''}</div>`).join('')||'<span class="text-muted">No sessions.</span>'}</div></div></div>`}load();setInterval(load,5000);
</script>{% endblock %}
