{% extends 'base.html' %}{% block title %}BookStream Security Intelligence{% endblock %}{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><div><h2>BookStream Security Intelligence</h2><p class="text-muted mb-0">Live insights from the connected BookStream event pipeline.</p></div><a class="btn btn-outline-primary" href="{{ url_for('dashboard') }}">Security Dashboard</a></div>
<div class="row g-3 mb-4" id="kpis"></div>
<div class="row g-3"><div class="col-lg-8"><div class="card cs-card p-3"><h5>Users</h5><input id="search" class="form-control mb-2" placeholder="Search user, email, ID, risk"><div class="table-responsive"><table class="table table-hover" id="users"><thead><tr><th>User</th><th>Status</th><th>Risk</th><th>Sessions</th><th>Last Active</th></tr></thead><tbody></tbody></table></div></div></div><div class="col-lg-4"><div class="card cs-card p-3"><h5>Pending Approvals</h5><div id="approvals"></div></div></div></div>
<script>
const labels={users:'Users',active_sessions:'Active Sessions',failed_logins:'Failed Logins',book_views:'Book Views',pdf_views:'PDF Views',downloads:'Downloads',searches:'Searches',bookmarks:'Bookmarks',reviews:'Reviews',ratings:'Ratings',medium:'Medium Risk',high:'High Risk',critical:'Critical',threats:'Threats',honeypot:'Honeypot',blocked_sessions:'Blocked Sessions',pending_approvals:'Pending Approvals'};
async function load(){const [a,u,p]=await Promise.all([fetch('/api/admin/integration/analytics'),fetch('/api/admin/integration/users'),fetch('/api/admin/integration/approvals')]);const d=await a.json(), users=await u.json(), aps=await p.json();document.getElementById('kpis').innerHTML=Object.entries(labels).map(([k,v])=>`<div class="col-6 col-md-3 col-xl-2"><div class="card cs-card p-3 text-center"><small class="text-muted">${v}</small><h4>${d[k]??0}</h4></div></div>`).join('');renderUsers(users);document.getElementById('approvals').innerHTML=aps.filter(x=>x.status==='PENDING').map(x=>{const frozen=x.request_type==='FROZEN_ACCOUNT_LOGIN';return `<div class="border rounded p-2 mb-2"><b>${x.username}</b><div>${frozen?'Frozen account sign-in review':'Sign-in review'}</div><div>${x.risk_level} · ${x.risk_score}/100</div><small>${x.reasons||''}</small><div class="mt-2">${frozen?`<button class="btn btn-sm btn-success" onclick="decide('${x.request_id}','UNFREEZE')">Unfreeze &amp; allow</button> <button class="btn btn-sm btn-danger" onclick="decide('${x.request_id}','KEEP_FROZEN')">Keep frozen</button>`:`<button class="btn btn-sm btn-success" onclick="decide('${x.request_id}','APPROVE')">Approve</button> <button class="btn btn-sm btn-danger" onclick="decide('${x.request_id}','DENY')">Deny</button>`}</div></div>`}).join('')||'<span class="text-muted">No pending approvals.</span>'}
function renderUsers(users){const q=document.getElementById('search').value.toLowerCase();document.querySelector('#users tbody').innerHTML=users.filter(u=>JSON.stringify(u).toLowerCase().includes(q)).map(u=>`<tr onclick="location.href='/bookstream-security/user/${u.bookstream_user_id}'" style="cursor:pointer"><td><b>${u.username||'-'}</b><br><small>${u.email||''}</small></td><td>${u.status}</td><td><span class="badge bg-${u.risk_level==='LOW'?'success':u.risk_level==='MEDIUM'?'warning':'danger'}">${u.risk_level} · ${u.risk_score}</span></td><td>${u.active_sessions}</td><td>${u.last_active?new Date(u.last_active).toLocaleString():'-'}</td></tr>`).join('')||'<tr><td colspan="5" class="text-muted">No connected users yet.</td></tr>'}
async function decide(id,decision){await fetch('/api/admin/integration/approval/'+id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision})});load()}
document.getElementById('search').addEventListener('input',load);load();setInterval(load,5000);
</script>{% endblock %}
